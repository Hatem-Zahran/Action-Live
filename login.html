<!DOCTYPE html>
<html lang="ar" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sign in</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
        const SUPABASE_URL = 'https://ktsmjchrpdmxffilzmob.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_I32Ys6xugqX2x2MRb75TbA_IonsDEm9';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        function getDeviceId() {
            const KEY = 'actionLiveDeviceId';
            let id = localStorage.getItem(KEY);
            if (!id) {
                id = 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
                    const r = Math.random() * 16 | 0;
                    const v = c === 'x' ? r : (r & 0x3 | 0x8);
                    return v.toString(16);
                });
                localStorage.setItem(KEY, id);
            }
            return id;
        }

        let _cachedGeo = null;
        async function getUserGeo() {
            if (_cachedGeo) return _cachedGeo;
            try {
                const res = await fetch('https://ipapi.co/json/', { cache: 'no-store' });
                const j = await res.json();
                _cachedGeo = {
                    ip: j.ip || 'unknown',
                    country: j.country_name ? `${j.country_name} (${j.country_code})` : 'unknown'
                };
            } catch (e) {
                _cachedGeo = { ip: 'unknown', country: 'unknown' };
            }
            return _cachedGeo;
        }

        async function verifyCode(code, isAuto = false) {
            const geo = await getUserGeo();
            const deviceId = getDeviceId();

            try {
                const { data, error } = await supabaseClient
                    .rpc('check_and_expire', {
                        p_code: code,
                        p_ip: geo.ip,
                        p_country: geo.country,
                        p_device_id: deviceId,
                        p_auto: isAuto
                    });

                if (!error && data && data.length > 0) {
                    const r = data[0];
                    const user = r.user_row || {};
                    return {
                        user: { ...user, result_code: r.result_code },
                        is_new_device: r.is_new_device === true,
                        error: null
                    };
                }
                if (error) console.error('[verifyCode] rpc error:', error);
            } catch (e) {
                console.error('[verifyCode] exception:', e);
            }
            return { user: null, is_new_device: false, error: 'Connection Error' };
        }

        async function checkSavedCode() {
            const savedCode = localStorage.getItem('activeActionCode');
            if (!savedCode) return;

            const { user } = await verifyCode(savedCode, true);
            if (!user) return;

            if (user.result_code === 'OK') {
                document.documentElement.style.display = 'none';
                window.location.href = 'categories.html';
                return;
            }

            if (user.result_code === 'NOT_REGISTERED' || user.result_code === 'USED_UP') {
                localStorage.removeItem('activeActionCode');
                return;
            }

            if (user.result_code === 'DEVICE_BLOCKED') {
                localStorage.removeItem('activeActionCode');
                showError('Your Device is blocked');
                return;
            }

            if (user.result_code === 'EXPIRED' || user.result_code === 'BLOCKED' || user.result_code === 'NOT_FOUND') {
                localStorage.removeItem('activeActionCode');
            }
        }

        checkSavedCode();
    </script>

    <style>
        :root {
            --accent: #ffbc00;
            --dark-bg: #050505;
            --card-bg: #0d0d0d;
            --error: #ff3e3e;
            --success: #2ecc71;
            --radius-smooth: 16px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background-color: var(--dark-bg); height: 100vh; display: flex; align-items: flex-end; justify-content: center; overflow: hidden; position: relative; }
        .full-backdrop { position: absolute; top: 0; left: 0; width: 100%; height: 50%; background: linear-gradient(0deg, var(--dark-bg) 0%, transparent 100%), url('https://up6.cc/2026/09/178863837232561.jpg') center/cover; z-index: 1; }
        .action-sheet { position: relative; z-index: 10; width: 100%; max-width: 550px; background: linear-gradient(to bottom, rgba(5, 5, 5, 0.88), rgba(5, 5, 5, 0.66)), url('https://up6.cc/2026/11/17936422868031.jpg') center/cover; border-top: 3px solid var(--accent); border-radius: 40px 40px 0 0; padding: 80px 35px 40px; text-align: center; box-shadow: 0 -20px 50px rgba(0,0,0,0.95); animation: slideUpFade 0.7s cubic-bezier(0.22, 1, 0.36, 1) both; }
        .avatar-container { position: absolute; top: -60px; left: 50%; transform: translateX(-50%); z-index: 15; background: var(--card-bg); padding: 8px; border-radius: 50%; border: 3px solid var(--accent); box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .avatar-frame { width: 105px; height: 105px; border-radius: 50%; background: #111 url('https://up6.cc/2025/10/176669513275231.jpg') center/cover; }
        h1 { font-size: 40px; font-weight: 800; margin-bottom: 8px; color: #fff; }
        .highlight-yellow { color: var(--accent); }
        .desc-text { font-size: 18px; color: rgba(255,255,255,0.65); margin-bottom: 20px; }
        .input-box { width: 100%; margin-bottom: 15px; }
        input {
            width: 100%;
            background: rgba(255, 255, 255, 0.04);
            border: 1.5px solid rgba(255, 255, 255, 0.4);
            padding: 16px;
            border-radius: var(--radius-smooth);
            color: var(--accent);
            font-size: 18px;
            text-align: center;
            font-weight: 700;
            transition: border-color 0.2s ease, border-width 0.2s ease, color 0.2s ease;
            outline: none;
        }
        input:focus { border-color: var(--accent); border-width: 2px; padding: 15.5px 16px; }
        input.error-field, input.error-field:focus {
            border-color: var(--error) !important;
            border-width: 2px !important;
            padding: 15.5px 16px !important;
            color: var(--error);
        }

        .btn-main {
            width: 100%; height: 54px;
            border-radius: var(--radius-smooth);
            background: var(--accent); color: #000;
            font-size: 16px; font-weight: 800;
            cursor: pointer; border: none;
            display: flex; align-items: center; justify-content: center;
            transition: background 0.2s ease, color 0.2s ease, box-shadow 0.2s ease;
            outline: none;
            -webkit-tap-highlight-color: transparent;
            box-shadow: 0 0 0 0 transparent;
        }
        .btn-main:focus, .btn-main:focus-visible, .btn-main:active {
            outline: none;
            box-shadow: 0 0 0 3px var(--dark-bg), 0 0 0 4.5px var(--accent);
        }
        .btn-main.success-btn { background: var(--success) !important; color: #fff !important; }
        .btn-main.success-btn:focus, .btn-main.success-btn:focus-visible, .btn-main.success-btn:active {
            box-shadow: 0 0 0 3px var(--dark-bg), 0 0 0 4.5px var(--success);
        }
        .btn-main.error-btn { background: var(--error) !important; color: #fff !important; }
        .btn-main.error-btn:focus, .btn-main.error-btn:focus-visible, .btn-main.error-btn:active {
            box-shadow: 0 0 0 3px var(--dark-bg), 0 0 0 4.5px var(--error);
        }
        .btn-main:hover { background: var(--accent); color: #000; }

        .loader { width: 22px; height: 22px; border: 3px solid rgba(0,0,0,0.15); border-top: 3px solid #000; border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .btn-get-code {
            display: flex; align-items: center; justify-content: center;
            background: rgba(13, 13, 13, 0.8); color: #ffcc33;
            width: 100%; height: 54px;
            border-radius: var(--radius-smooth);
            font-size: 15px; font-weight: 800;
            text-decoration: none;
            border: 1.5px solid var(--accent);
            margin-top: 15px;
            transition: background 0.2s ease, color 0.2s ease;
            outline: none;
            -webkit-tap-highlight-color: transparent;
        }
        .btn-get-code:hover { background: rgba(255, 188, 0, 0.15); color: #ffe082; }
        .btn-get-code:focus, .btn-get-code:focus-visible {
            outline: none;
            background: rgba(255, 188, 0, 0.15); color: #ffe082;
        }

        .error-shake { animation: shakeAnim 0.4s ease; }
        @keyframes shakeAnim { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
        @keyframes slideUpFade { from { opacity: 0; transform: translateY(60px); } to { opacity: 1; transform: translateY(0); } }

        button, a, input { -webkit-tap-highlight-color: transparent; }
    </style>
</head>
<body>

<div class="full-backdrop"></div>

<div class="action-sheet">
    <div class="avatar-container"><div class="avatar-frame"></div></div>
    <h1>Sign <span class="highlight-yellow">in</span></h1>
    <p class="desc-text">Enter your activation code to access your account</p>

    <form id="authForm" onsubmit="event.preventDefault(); handleAuth();" style="width:100%;">
        <div class="input-box">
            <input type="tel" id="code" maxlength="6" placeholder="Enter activation code" tabindex="0" autofocus oninput="this.value = this.value.replace(/[^0-9]/g, '')">
        </div>

        <div class="btn-stack">
            <button type="submit" class="btn-main" id="loginBtn" tabindex="0">
                <span id="btnText">Activate Account</span>
            </button>
            <a href="https://t.me/action_live_app/4" class="btn-get-code" tabindex="0">Request Activation Code</a>
        </div>
    </form>
</div>

<script>
    (function setupArrowNavigation() {
        const focusable = [
            document.getElementById('code'),
            document.getElementById('loginBtn'),
            document.querySelector('.btn-get-code')
        ].filter(Boolean);

        let currentIndex = 0;

        function focusAt(index) {
            if (index < 0) index = 0;
            if (index >= focusable.length) index = focusable.length - 1;
            currentIndex = index;
            focusable[currentIndex].focus();
        }

        const enterKeys = ['Enter', ' ', 'Select'];

        document.addEventListener('keydown', (e) => {
            const keysNext = ['ArrowDown', 'ArrowRight'];
            const keysPrev = ['ArrowUp', 'ArrowLeft'];

            if (keysNext.includes(e.key)) {
                e.preventDefault();
                focusAt(currentIndex + 1);
                return;
            }

            if (keysPrev.includes(e.key)) {
                e.preventDefault();
                focusAt(currentIndex - 1);
                return;
            }

            if (enterKeys.includes(e.key) && !e.repeat) {
                const active = document.activeElement;
                if (active === focusable[0] || active === focusable[1]) {
                    e.preventDefault();
                    handleAuth();
                } else if (active === focusable[2]) {
                    e.preventDefault();
                    focusable[2].click();
                }
            }
        });

        focusable.forEach((el, i) => {
            el.addEventListener('focus', () => { currentIndex = i; });
        });
    })();

    window.addEventListener('load', () => {
        const codeInput = document.getElementById('code');
        if (codeInput && document.documentElement.style.display !== 'none') {
            codeInput.focus();
        }
    });

    async function handleAuth() {
        const input = document.getElementById('code');
        const btn = document.getElementById('loginBtn');
        const btnText = document.getElementById('btnText');
        const userCode = input.value.trim();

        if (userCode === '') {
            input.classList.add('error-field', 'error-shake');
            setTimeout(() => {
                input.classList.remove('error-shake', 'error-field');
                input.focus();
            }, 1500);
            return;
        }

        btnText.innerHTML = '<div class="loader"></div>';
        btn.style.pointerEvents = 'none';

        try {
            const { user, error } = await verifyCode(userCode);

            if (error || !user) { showError('Invalid Code'); return; }

            switch (user.result_code) {
                case 'NOT_FOUND':      showError('Invalid Code'); return;
                case 'BLOCKED':        showError('The Code is Blocked'); return;
                case 'EXPIRED':        showError('The Code is Expired'); return;
                case 'USED_UP':        showError('Code Already Used'); return;
                case 'DEVICE_BLOCKED': showError('Your Device is blocked'); return;
                case 'OK':             break;
                default:               showError('Invalid Code'); return;
            }

            btn.classList.add('success-btn');
            btnText.innerHTML = 'Account Activated';
            localStorage.setItem('activeActionCode', userCode);
            setTimeout(() => window.location.href = 'categories.html', 1000);

        } catch (err) {
            console.error('[handleAuth] exception:', err);
            showError('Connection Error');
        }
    }

    function showError(msg) {
        const input = document.getElementById('code');
        const btn = document.getElementById('loginBtn');
        const btnText = document.getElementById('btnText');

        input.classList.add('error-field', 'error-shake');
        btn.classList.add('error-btn');
        btnText.innerHTML = msg;

        setTimeout(() => {
            input.classList.remove('error-shake', 'error-field');
            btn.classList.remove('error-btn');
            btnText.innerHTML = 'Activate Account';
            btn.style.pointerEvents = 'auto';
            input.value = '';
            input.focus();
        }, 2000);
    }
</script>
</body>
</html>
