<!DOCTYPE html>
<html lang="en" dir="ltr" class="h-full">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>home</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  theme: {
    extend: {
      fontFamily: {
        inter: ['Inter','sans-serif'],
        display: ['"Archivo Black"','sans-serif']
      },
      colors: { brandGold: '#ffbc00', darkBase: '#0a0b0e', darkCard: '#12141c' }
    }
  }
}
</script>

<style>
  html, body { height: 100%; margin: 0; }
  body {
    font-family: 'Inter', sans-serif;
    background: #0a0b0e;
    color: #fff;
    -webkit-user-select: none;
    user-select: none;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 32px;
    box-sizing: border-box;
    position: relative;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse 80% 50% at 50% 30%, rgba(20,24,36,1) 0%, rgba(10,11,14,1) 70%);
    z-index: -3;
    pointer-events: none;
  }
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.018) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.018) 1px, transparent 1px);
    background-size: 80px 80px;
    z-index: -2;
    pointer-events: none;
    mask-image: radial-gradient(ellipse 70% 60% at 50% 50%, black 30%, transparent 80%);
    -webkit-mask-image: radial-gradient(ellipse 70% 60% at 50% 50%, black 30%, transparent 80%);
  }

  .glow {
    position: fixed;
    top: 55%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 900px;
    height: 500px;
    background: radial-gradient(ellipse, rgba(255,188,0,0.06) 0%, transparent 65%);
    pointer-events: none;
    z-index: -1;
  }

  .intro {
    width: 100%;
    max-width: 1400px;
    text-align: center;
    margin-bottom: 44px;
    flex-shrink: 0;
    position: relative;
    z-index: 1;
    opacity: 0;
    transform: translateY(14px) scale(.94);
    filter: blur(4px);
    animation: introReveal .55s cubic-bezier(.34, 1.56, .64, 1) .05s forwards;
  }

  .intro__rule {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin: 0 auto 16px;
    opacity: 0;
    transform: scaleX(.4);
    transform-origin: center;
    animation: ruleIn .45s cubic-bezier(.34, 1.56, .64, 1) .15s forwards;
  }

  .intro__headline {
    font-family: 'Archivo Black', sans-serif;
    font-size: clamp(1.85rem, 3.4vw, 3rem);
    line-height: 1.15;
    letter-spacing: -0.02em;
    color: #ffffff;
    max-width: 900px;
    margin: 0 auto;
    text-shadow: 0 2px 20px rgba(0,0,0,0.4);
    opacity: 0;
    transform: translateY(8px);
    animation: headlineIn .5s cubic-bezier(.34, 1.56, .64, 1) .25s forwards;
  }

  @keyframes introReveal {
    to { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
  }

  @keyframes ruleIn {
    to { opacity: 1; transform: scaleX(1); }
  }

  @keyframes headlineIn {
    to { opacity: 1; transform: translateY(0); }
  }

  .intro__rule-line {
    width: 56px;
    height: 3px;
    background: #ffbc00;
  }
  .intro__rule-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #ffbc00;
    position: relative;
  }
  .intro__rule-dot::after {
    content: '';
    position: absolute;
    inset: -3px;
    border-radius: 50%;
    background: #ffbc00;
    opacity: .45;
    animation: dotPulse 2s ease-out infinite 1s;
  }
  @keyframes dotPulse {
    0%   { transform: scale(1);   opacity: .45; }
    100% { transform: scale(2.4); opacity: 0; }
  }

  .intro__headline strong {
    font-weight: 400;
    color: #ffbc00;
    white-space: nowrap;
  }

  .cards-container {
    display: flex;
    gap: 24px;
    width: 100%;
    max-width: 1400px;
    align-items: center;
    justify-content: center;
    position: relative;
    z-index: 1;
    padding-bottom: 18px;
  }

  .iptv-card {
    position: relative;
    flex: 1 1 0;
    height: min(60vh, 480px);
    max-width: 420px;
    border-radius: 16px;
    overflow: hidden;
    background: #12141c;
    text-decoration: none;
    border: 2px solid rgba(255,255,255,0.08);
    transition:
      border-color .25s cubic-bezier(.2,.8,.2,1),
      opacity .25s cubic-bezier(.2,.8,.2,1);
    opacity: 0;
    transform: scale(.85) translateY(30px);
    filter: blur(6px);
    animation: cardSnap .3s cubic-bezier(.34, 1.56, .64, 1) forwards;
  }

  .iptv-card:nth-child(1) { animation-delay: .45s; }
  .iptv-card:nth-child(2) { animation-delay: .75s; }
  .iptv-card:nth-child(3) { animation-delay: 1.05s; }

  @keyframes cardSnap {
    0%   { opacity: 0; transform: scale(.85) translateY(30px); filter: blur(6px); }
    100% { opacity: 1; transform: scale(1) translateY(0); filter: blur(0); }
  }

  .iptv-card__bg {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    opacity: .5;
    filter: grayscale(60%) brightness(.7);
    transition: opacity .3s ease, filter .3s ease, transform .5s cubic-bezier(.2,.8,.2,1);
  }

  .iptv-card__overlay {
    position: absolute; inset: 0;
    background: linear-gradient(to top, #0a0b0e 10%, rgba(10,11,14,.35) 60%, transparent 100%);
  }

  .iptv-card__corner-glow {
    position: absolute;
    top: 0; right: 0;
    width: 140px;
    height: 140px;
    background: radial-gradient(circle at top right, rgba(255,188,0,0.18) 0%, transparent 70%);
    opacity: 0;
    transition: opacity .3s ease;
    z-index: 1;
    pointer-events: none;
  }
  .iptv-card.focused .iptv-card__corner-glow { opacity: 1; }

  .iptv-card__bar {
    position: absolute;
    left: 0; top: 50%;
    width: 3px; height: 0;
    background: #ffbc00;
    transform: translateY(-50%);
    transition: height .25s ease;
    z-index: 3;
  }

  .iptv-card__index {
    position: absolute;
    top: 14px; right: 20px;
    font-family: 'Archivo Black', sans-serif;
    font-size: 3.5rem;
    line-height: 1;
    letter-spacing: -0.04em;
    color: rgba(255,255,255,0.06);
    transition: color .25s ease;
    z-index: 2;
    pointer-events: none;
  }

  .iptv-card__corner {
    position: absolute;
    width: 22px; height: 22px;
    border-color: rgba(255,188,0,0);
    border-style: solid;
    transition: width .25s ease, height .25s ease, border-color .25s ease;
    z-index: 3;
    pointer-events: none;
  }
  .iptv-card__corner--tl { top: 12px; left: 12px; border-width: 2px 0 0 2px; border-top-left-radius: 6px; }
  .iptv-card__corner--tr { top: 12px; right: 12px; border-width: 2px 2px 0 0; border-top-right-radius: 6px; }
  .iptv-card__corner--bl { bottom: 12px; left: 12px; border-width: 0 0 2px 2px; border-bottom-left-radius: 6px; }
  .iptv-card__corner--br { bottom: 12px; right: 12px; border-width: 0 2px 2px 0; border-bottom-right-radius: 6px; }

  .iptv-card__underline {
    position: absolute;
    bottom: -6px;
    left: 0;
    height: 2px;
    width: 0%;
    background: #ffbc00;
    transition: width .3s cubic-bezier(.2,.8,.2,1);
    z-index: 4;
    pointer-events: none;
  }

  .iptv-card__content {
    position: absolute;
    inset: 0;
    z-index: 2;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    padding: 0 12px 32px;
  }

  .iptv-card__title {
    font-family: 'Archivo Black', sans-serif;
    font-size: clamp(2.5rem, 6vw, 4rem);
    line-height: .95;
    letter-spacing: -0.02em;
    color: #fff;
    text-align: center;
    text-transform: uppercase;
    transition: color .25s ease;
    white-space: nowrap;
  }

  .iptv-card.focused { border-color: #ffbc00; }
  .iptv-card.focused .iptv-card__bg {
    opacity: .9;
    filter: grayscale(0%) brightness(1);
    transform: scale(1.05);
  }
  .iptv-card.focused .iptv-card__bar { height: 60%; }
  .iptv-card.focused .iptv-card__index { color: rgba(255,188,0,0.22); }
  .iptv-card.focused .iptv-card__title { color: #ffbc00; }
  .iptv-card.focused .iptv-card__corner {
    width: 28px; height: 28px;
    border-color: rgba(255,188,0,0.9);
  }
  .iptv-card.focused .iptv-card__underline { width: 100%; }

  .cards-container.has-focus .iptv-card:not(.focused) { opacity: .45; }

  .iptv-card:focus { outline: none; }

  @media (max-width: 768px) {
    body {
      overflow-y: auto;
      align-items: flex-start;
      justify-content: flex-start;
      padding: 28px 20px;
    }
    .glow { width: 100%; height: 300px; top: 60%; opacity: .8; }
    .intro { margin-bottom: 32px; text-align: center; }
    .intro__rule { margin-bottom: 14px; }
    .intro__rule-line { width: 44px; }
    .intro__headline {
      font-size: 2rem;
      line-height: 1.22;
      letter-spacing: -0.015em;
      max-width: 100%;
      padding: 0 4px;
    }
    .intro__headline strong { white-space: normal; }
    .cards-container { flex-direction: column; gap: 20px; }
    .iptv-card {
      flex: 0 0 auto;
      width: 100%;
      max-width: none;
      height: 200px;
    }
    .iptv-card__index { font-size: 3rem; }
    .iptv-card__title { font-size: 2.8rem; }
    .iptv-card__underline { display: none; }
    .iptv-card__corner-glow { display: none; }
    .cards-container.has-focus .iptv-card:not(.focused) { opacity: 1; }
  }

  @media (max-width: 380px) {
    .intro__headline { font-size: 1.75rem; }
    .iptv-card__title { font-size: 2.4rem; }
  }

  @media (min-width: 1920px) {
    .intro__headline { font-size: 3.6rem; }
    .iptv-card { height: min(62vh, 560px); max-width: 480px; }
    .iptv-card__title { font-size: 4.5rem; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition-duration: .01ms !important; animation-duration: .01ms !important; }
  }
</style>
</head>
<body>

<div class="glow"></div>

<div class="intro">
  <div class="intro__rule">
    <span class="intro__rule-line"></span>
    <span class="intro__rule-dot"></span>
    <span class="intro__rule-line"></span>
  </div>
  <h1 class="intro__headline">What do you want to <strong>watch</strong>?</h1>
</div>

<main class="cards-container" id="cardsContainer">

  <a href="go:live" class="iptv-card" tabindex="0" data-index="0" aria-label="Live TV">
    <img class="iptv-card__bg" src="https://up6.cc/2026/09/179000627701621.png"
         alt="" onerror="this.src='https://placehold.co/800x600/12141c/ffbc00?text=Live+TV'"/>
    <div class="iptv-card__overlay"></div>
    <div class="iptv-card__corner-glow"></div>
    <span class="iptv-card__index">01</span>
    <span class="iptv-card__bar"></span>
    <span class="iptv-card__underline"></span>
    <span class="iptv-card__corner iptv-card__corner--tl"></span>
    <span class="iptv-card__corner iptv-card__corner--tr"></span>
    <span class="iptv-card__corner iptv-card__corner--bl"></span>
    <span class="iptv-card__corner iptv-card__corner--br"></span>
    <div class="iptv-card__content">
      <h2 class="iptv-card__title">Live TV</h2>
    </div>
  </a>

  <a href="go:movies" class="iptv-card" tabindex="0" data-index="1" aria-label="Movies">
    <img class="iptv-card__bg" src="https://up6.cc/2026/09/179000386859291.jpg"
         alt="" onerror="this.src='https://placehold.co/800x600/12141c/ffbc00?text=Movies'"/>
    <div class="iptv-card__overlay"></div>
    <div class="iptv-card__corner-glow"></div>
    <span class="iptv-card__index">02</span>
    <span class="iptv-card__bar"></span>
    <span class="iptv-card__underline"></span>
    <span class="iptv-card__corner iptv-card__corner--tl"></span>
    <span class="iptv-card__corner iptv-card__corner--tr"></span>
    <span class="iptv-card__corner iptv-card__corner--bl"></span>
    <span class="iptv-card__corner iptv-card__corner--br"></span>
    <div class="iptv-card__content">
      <h2 class="iptv-card__title">Movies</h2>
    </div>
  </a>

  <a href="go:series" class="iptv-card" tabindex="0" data-index="2" aria-label="Series">
    <img class="iptv-card__bg" src="https://up6.cc/2026/09/179000412219791.jpg"
         alt="" onerror="this.src='https://placehold.co/800x600/12141c/ffbc00?text=Series'"/>
    <div class="iptv-card__overlay"></div>
    <div class="iptv-card__corner-glow"></div>
    <span class="iptv-card__index">03</span>
    <span class="iptv-card__bar"></span>
    <span class="iptv-card__underline"></span>
    <span class="iptv-card__corner iptv-card__corner--tl"></span>
    <span class="iptv-card__corner iptv-card__corner--tr"></span>
    <span class="iptv-card__corner iptv-card__corner--bl"></span>
    <span class="iptv-card__corner iptv-card__corner--br"></span>
    <div class="iptv-card__content">
      <h2 class="iptv-card__title">Series</h2>
    </div>
  </a>

</main>

<script>
document.addEventListener('DOMContentLoaded', () => {
  const container = document.getElementById('cardsContainer');
  const cards = [...container.querySelectorAll('.iptv-card')];
  let activeIndex = 0;

  const AUTO_DELAY = 5000;
  const MOBILE_BREAKPOINT = 768;
  let autoTimer = null;
  let userInteracted = false;

  function isMobile() {
    return window.innerWidth <= MOBILE_BREAKPOINT;
  }

  function scrollToCard(card) {
    if (!isMobile()) return;
    card.scrollIntoView({ block: 'center', behavior: 'smooth' });
  }

  function setFocus(index, opts = {}) {
    if (!cards.length) return;
    index = (index + cards.length) % cards.length;
    cards.forEach((c, i) => c.classList.toggle('focused', i === index));
    container.classList.add('has-focus');
    activeIndex = index;
    if (opts.scroll !== false) {
      scrollToCard(cards[index]);
    }
  }

  function startAuto() {
    stopAuto();
    autoTimer = setInterval(() => {
      if (userInteracted) return;
      setFocus(activeIndex + 1);
    }, AUTO_DELAY);
  }

  function stopAuto() {
    if (autoTimer) {
      clearInterval(autoTimer);
      autoTimer = null;
    }
  }

  function onUserAction() {
    userInteracted = true;
    stopAuto();
  }

  setTimeout(() => {
    setFocus(0, { scroll: false });
    startAuto();
  }, 1500);

  const KEYMAP = {
    39:'right', 22:'right', ArrowRight:'right', Right:'right',
    37:'left',  21:'left',  ArrowLeft:'left',   Left:'left',
    40:'next',  20:'next',  ArrowDown:'next',   Down:'next',
    38:'prev',  19:'prev',  ArrowUp:'prev',     Up:'prev',
    13:'ok',    23:'ok',    66:'ok', Enter:'ok', OK:'ok', ' ':'ok',
    8:'back',   27:'back',  4:'back', Backspace:'back', Escape:'back', Back:'back'
  };

  document.addEventListener('keydown', (e) => {
    const action = KEYMAP[e.keyCode] || KEYMAP[e.code] || KEYMAP[e.key];
    if (!action) return;
    e.preventDefault();
    e.stopPropagation();

    if (action === 'right' || action === 'next') {
      onUserAction();
      setFocus(activeIndex + 1);
    }
    else if (action === 'left' || action === 'prev') {
      onUserAction();
      setFocus(activeIndex - 1);
    }
    else if (action === 'ok') {
      const href = cards[activeIndex]?.getAttribute('href');
      if (href) window.location.href = href;
    }
  }, true);

  cards.forEach((card, idx) => {
    card.addEventListener('mouseenter', () => {
      onUserAction();
      setFocus(idx);
    });
    card.addEventListener('focus', () => {
      onUserAction();
      setFocus(idx);
    });
    card.addEventListener('click', () => {
      onUserAction();
    });
    card.addEventListener('touchstart', () => {
      onUserAction();
    }, { passive: true });
  });
});
</script>
</body>
</html>
