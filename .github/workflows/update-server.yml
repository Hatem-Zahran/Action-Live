import os
import glob
import re

def update_m3u8_files():
    new_username = os.environ.get("NEW_USERNAME")
    new_password = os.environ.get("NEW_PASSWORD")
    
    print(f"Searching for files... Username provided: {bool(new_username)}")

    if not new_username or not new_password:
        print("Error: Username or Password not provided!")
        return

    # التعبير النمطي للبحث عن روابط السيرفر القديم
    pattern = re.compile(r'(http://line\.play01\.top/live/)([^/]+)/([^/]+)(/.*\.m3u8)')

    # البحث في المجلد الحالي والمجلدات الفرعية عن ملفات m3u8
    files = glob.glob('**/*.m3u8', recursive=True)
    print(f"Found {len(files)} m3u8 files.")
    
    if not files:
        print("No .m3u8 files found in the repository.")
        return

    updated_any = False
    for file_path in files:
        with open(file_path, 'r', encoding='utf-8') as f:
            content = f.read()

        updated_content, count = pattern.subn(f'\\1{new_username}/{new_password}\\4', content)
        
        if count > 0:
            with open(file_path, 'w', encoding='utf-8') as f:
                f.write(updated_content)
            print(f"Successfully updated {count} links in: {file_path}")
            updated_any = True
        else:
            print(f"No matching links found in: {file_path}")

    if not updated_any:
        print("Warning: No links matched the pattern in any file. Check if the server URL in files matches the regex.")

if __name__ == "__main__":
    update_m3u8_files()
