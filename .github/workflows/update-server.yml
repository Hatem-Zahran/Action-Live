name: Update M3U8 Server Credentials

on:
  workflow_dispatch:
    inputs:
      username:
        description: 'New Username (User)'
        required: true
        type: string
      password:
        description: 'New Password'
        required: true
        type: string

jobs:
  update-files:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run update script
        env:
          NEW_USERNAME: ${{ inputs.username }}
          NEW_PASSWORD: ${{ inputs.password }}
        run: python .github/scripts/update_channels.py

      - name: Commit and push changes
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add -A
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update server credentials [skip ci]" && git push)
