name: Update Stream Bandwidth

on:
  push:
    branches:
      - main  # أو اسم الفرع الأساسي عندك لو كان master

jobs:
  update-files:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Replace text in files
        run: |
          # استخدام sed للبحث عن السطور اللي بتبدأ بـ EXT-X-STREAM-INF وتعديلها
          find . -type f \( -name "*.m3u" -o -name "*.m3u8" -o -name "*.txt" \) -exec sed -i 's/#EXT-X-STREAM-INF:.*/#EXT-X-STREAM-INF:BANDWIDTH=1/g' {} +

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update stream bandwidth to 1"
          branch: main
